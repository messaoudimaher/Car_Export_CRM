name: CI/CD Pipeline Architecture (TASK-2102)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ------------------------------------------------------------------------------
  # Job 1: Code Linting, Formatting & Type Checks
  # ------------------------------------------------------------------------------
  lint-and-format:
    name: Lint, Format & Static Type Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install backend dependencies
        working-directory: ./src/backend
        run: uv sync

      - name: Run Ruff Lint & Format Check
        working-directory: ./src/backend
        run: uv run ruff check .

      - name: Run Mypy Type Verification
        working-directory: ./src/backend
        run: uv run mypy app

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: ./src/frontend
        run: npm ci

      - name: TypeScript Type Check (Strict Compiler Verification)
        working-directory: ./src/frontend
        run: npx tsc --noEmit

  # ------------------------------------------------------------------------------
  # Job 2: Backend Pytest, Database Migrations & Security Audit
  # ------------------------------------------------------------------------------
  backend-test-and-audit:
    name: Backend Pytest & SAST Security Audit
    needs: lint-and-format
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: crm_test
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv package manager
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        working-directory: ./src/backend
        run: uv sync

      - name: Verify PostgreSQL & Execute Alembic Schema Migrations
        working-directory: ./src/backend
        env:
          DATABASE_URL: postgresql+asyncpg://crm_user:crm_password@localhost:5432/crm_test
        run: |
          uv run alembic upgrade head

      - name: Run Backend Pytest Suite (Coverage Gate >= 80%)
        working-directory: ./src/backend
        env:
          DATABASE_URL: postgresql+asyncpg://crm_user:crm_password@localhost:5432/crm_test
          JWT_SECRET_KEY: ci_test_secret_key_32_bytes_min_length!!
        run: |
          uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Run Bandit Security SAST Audit
        working-directory: ./src/backend
        run: |
          uv run bandit -r app -l

  # ------------------------------------------------------------------------------
  # Job 3: Frontend Vitest & React Component Specs
  # ------------------------------------------------------------------------------
  frontend-test:
    name: Frontend Vitest & Component Specs
    needs: lint-and-format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: ./src/frontend
        run: npm ci

      - name: Run Vitest Unit & React Component Suite
        working-directory: ./src/frontend
        run: npm run test

  # ------------------------------------------------------------------------------
  # Job 4: Multi-Stage Docker Image Build & Trivy Vulnerability Scan (TASK-2101/2102)
  # ------------------------------------------------------------------------------
  docker-build-and-scan:
    name: Multi-Stage Docker Build & Vulnerability Scan
    needs: [backend-test-and-audit, frontend-test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (`car-export-backend:<sha>`)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          load: true
          tags: |
            car-export-backend:${{ github.sha }}
            car-export-backend:latest

      - name: Build Frontend Docker Image (`car-export-frontend:<sha>`)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          load: true
          tags: |
            car-export-frontend:${{ github.sha }}
            car-export-frontend:latest

      - name: Run Trivy Vulnerability Scanner on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'car-export-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ------------------------------------------------------------------------------
  # Job 5: Playwright End-to-End Test Suite (Journeys J1 - J8)
  # ------------------------------------------------------------------------------
  e2e-test-suite:
    name: Playwright E2E Suite (Journeys J1-J8)
    needs: docker-build-and-scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright & Test Dependencies
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run Playwright E2E Journey Specs
        working-directory: ./e2e
        run: npx playwright test --project=chromium

  # ------------------------------------------------------------------------------
  # Job 6: Staging Deployment & Rolling Update Approval Gate
  # ------------------------------------------------------------------------------
  deploy-staging-gate:
    name: Staging Deployment & Rolling Update Gate
    needs: e2e-test-suite
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Log Deployment Metadata
        run: |
          echo "Deploying Immutable Container Tag: ${{ github.sha }}"
          echo "Environment: Staging"
          echo "Status: Quality Gates 100% Verified"

